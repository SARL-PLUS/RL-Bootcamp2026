<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd International Reinforcement Learning Bootcamp 2026 Landscape Flyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* A4 Landscape Container (297mm x 210mm ratio = 1.414) */
        .flyer-container {
            width: 100%;
            max-width: 1150px;
            aspect-ratio: 1.414 / 1;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 50px;
            overflow: hidden;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* Top Header Area */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 10;
        }

        .top-left {
            display: flex;
            flex-direction: column;
            width: 40%;
        }

        .lab-logo {
            width: 220px;
            max-width: 90%;
            height: auto;
            margin-bottom: 15px;
        }

        .date-location {
            font-size: 18px;
            font-weight: 800;
            color: #000;
            font-family: 'Poppins', sans-serif;
            line-height: 1.35;
        }

        .top-right {
            text-align: right;
            width: 60%;
        }

        .top-right h1 {
            font-size: 38px;
            font-weight: 800;
            color: #3b50df;
            font-family: 'Poppins', sans-serif;
            line-height: 1.1;
            letter-spacing: -0.5px;
            transform: translateY(2cm);
        }

        /* Faded Castle Sketch Background */
        .middle-sketch {
            position: absolute;
            top: 10%;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 1;
            pointer-events: none;
        }

        .middle-sketch img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            opacity: 0.75;
            transform: translateY(0.5cm) scale(0.80);
        }

        .middle-sketch::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(to bottom, #ffffff 5%, rgba(255, 255, 255, 0));
            z-index: 2;
        }

        .middle-sketch::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: linear-gradient(to top, #ffffff 10%, rgba(255, 255, 255, 0));
            z-index: 2;
        }

        /* Bottom Section containing Speakers in 1 Row and Partner Logos */
        .bottom-content {
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 10;
            margin-top: auto;
        }

        /* Keynote Speakers Section (1 Row) */
        .speakers-section {
            width: 100%;
        }

        .speakers-title {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            color: #000;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 16px;
            text-align: center;
        }

        .speakers-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 Keynotes in ONE ROW */
            gap: 20px;
            width: 100%;
        }

        .speaker-card {
            text-align: center;
        }

        .speaker-card img {
            width: 75px;
            height: 75px;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 8px auto;
            background-color: #eee;
            display: block;
        }

        .speaker-name {
            font-weight: 700;
            font-size: 13px;
            color: #000;
            font-family: 'Space Grotesk', sans-serif;
        }

        .speaker-affiliation {
            font-size: 11px;
            font-style: italic;
            color: #333;
        }

        /* Partner Logos Section (Enlarged & Rearranged) */
        .logos-section {
            width: 100%;
            padding-top: 10px;
        }

        .logos-row {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px 35px;
            width: 100%;
        }

        .partner-logo {
            height: 55px; /* Enlarged partner logos */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .partner-logo img {
            max-height: 100%;
            width: auto;
            object-fit: contain;
        }

        /* Print setup for native A4 Landscape */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }

            body {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .flyer-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 12mm 16mm !important;
                max-width: 100% !important;
                width: 297mm !important;
                height: 210mm !important;
                aspect-ratio: auto !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>

    <div class="flyer-container">

        <!-- Top Header Area -->
        <div class="top-section">
            <div class="top-left">
                <img class="lab-logo" src="IDA Logo High.png" alt="IDA Lab">
                <div class="date-location">
                    September 16–18, 2026<br>
                    PLUS University Salzburg
                </div>
            </div>
            <div class="top-right">
                <h1>3rd International<br>Reinforcement Learning<br>Bootcamp</h1>
            </div>
        </div>

        <!-- Faded Castle Sketch Background -->
        <div class="middle-sketch">
            <img src="sketch2.png" alt="Salzburg Background">
        </div>

        <!-- Bottom Content Area -->
        <div class="bottom-content">

            <!-- Keynote Speakers (All 4 in ONE ROW) -->
            <div class="speakers-section">
                <h3 class="speakers-title">KEYNOTE SPEAKERS</h3>
                <div class="speakers-row">
                    <div class="speaker-card">
                        <img src="Verena_Kain.jpg" alt="Verena Kain">
                        <div class="speaker-name">Verena Kain</div>
                        <div class="speaker-affiliation">CERN</div>
                    </div>
                    <div class="speaker-card">
                        <img src="michael_bowling.jpg" alt="Michael Bowling">
                        <div class="speaker-name">Michael Bowling</div>
                        <div class="speaker-affiliation">University of Alberta</div>
                    </div>
                    <div class="speaker-card">
                        <img src="Elmar_Rueckert.jpeg" alt="Elmar Rückert">
                        <div class="speaker-name">Elmar Rückert</div>
                        <div class="speaker-affiliation">University of Leoben</div>
                    </div>
                    <div class="speaker-card">
                        <img src="ronald_ortner.jpg" alt="Ronald Ortner">
                        <div class="speaker-name">Ronald Ortner</div>
                        <div class="speaker-affiliation">University of Leoben</div>
                    </div>
                </div>
            </div>

            <!-- Enlarged & Rearranged Partner Logos Row -->
            <div class="logos-section">
                <div class="logos-row">
                    <div class="partner-logo"><img src="image.png" alt="Partner"></div>
                    <div class="partner-logo"><img src="JOANNEUM_RESEARCH_ROB_print.png" alt="JR Robotics"></div>
                    <div class="partner-logo"><img src="JOANNEUM_RESEARCH_DIG_print.png" alt="JR Digital"></div>
                    <div class="partner-logo"><img src="DIH-West-Blue.png" alt="DIH West" style="transform: scale(0.80);"></div>
                    <div class="partner-logo"><img src="AI_Austrialogo.png" alt="AI Austria" style="transform: translate(-0.3cm, 0.1cm) scale(1.45);"></div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
