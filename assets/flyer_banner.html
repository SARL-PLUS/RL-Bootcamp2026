<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd International Reinforcement Learning Bootcamp 2026 Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Banner Container (Panoramic aspect ratio matching attached image ~ 3.6:1) */
        .banner-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 3.6 / 1;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 40px;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #e0e4ec;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* Title Area (Top Right) */
        .title-section {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-top: 4px;
        }

        .title-section h1 {
            font-size: 32px;
            font-weight: 800;
            color: #3b50df;
            font-family: 'Poppins', sans-serif;
            line-height: 1.15;
            letter-spacing: -0.5px;
            text-align: right;
        }

        /* Fully Visible Castle Sketch Background */
        .middle-sketch {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .middle-sketch img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
            opacity: 1;
        }

        /* Print setup */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }

            body {
                padding: 0 !important;
                background-color: #ffffff !important;
            }

            .banner-container {
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100vw !important;
                height: 100vh !important;
            }
        }
    </style>
</head>

<body>

    <div class="banner-container">

        <!-- Main Title (No logos, no date) -->
        <div class="title-section">
            <h1>3rd International<br>Reinforcement Learning<br>Bootcamp</h1>
        </div>

        <!-- Castle Sketch Background -->
        <div class="middle-sketch">
            <img src="sketch2.png" alt="Salzburg Castle Sketch">
        </div>

    </div>

</body>

</html>
